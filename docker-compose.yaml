services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: ${APP_NAME}
        HTTP_PORT: ${HTTP_PORT}
    container_name: ${APP_NAME}
    networks:
      - raspyx-network
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
    env_file:
      - .env
    logging:
      driver: "local"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    command: >
      sh -c "make migrate-up; ./${APP_NAME}"
    restart: always

  postgres:
    image: postgres:17-alpine
    container_name: ${APP_NAME}db
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${APP_NAME}db
    networks:
      - raspyx-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sh:/docker-entrypoint-initdb.d/init_db.sh
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME}redis
    networks:
      - raspyx-network
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}

  prometheus:
    build:
      context: ./prometheus
      dockerfile: Dockerfile.prometheus
    container_name: ${APP_NAME}prometheus
    networks:
      - raspyx-network
    restart: always
#    ports:
#      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana
    container_name: ${APP_NAME}grafana
    networks:
      - raspyx-network
    restart: always
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  kafka:
    container_name: ${APP_NAME}kafka
    image: bitnami/kafka:latest
    restart: unless-stopped
    volumes:
      - kafka_data:/bitnami/kafka/data
    networks:
      - raspyx-network
    environment:
      - KAFKA_KRAFT_CLUSTER_ID=kraft-cluster
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:${KAFKA_PORT}
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_LOG_DIRS=/bitnami/kafka/data
      - ALLOW_PLAINTEXT_LISTENER=yes
    healthcheck:
      test: ["CMD", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  grafana_data:
  prometheus_data:
  kafka_data:

networks:
  raspyx-network:
    driver: bridge
